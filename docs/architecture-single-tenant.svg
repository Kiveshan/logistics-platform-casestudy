<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-labelledby="t1 d1">
  <title id="t1">Single-tenant logistics platform architecture</title>
  <desc id="d1">React SPA behind Nginx calls an Express API whose routes sit below a single global auth guard. The model layer issues raw SQL to PostgreSQL and mints presigned S3 URLs for compliance documents. EventBridge fires a Lambda monthly, which calls an authenticated endpoint to generate all client statements in one transaction.</desc>

  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7d94"/>
    </marker>
    <style>
      .h    { font: 600 22px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .hs   { font: 400 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #7d8da0; }
      .bt   { font: 600 15px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .bs   { font: 400 10.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #9fb0c4; }
      .it   { font: 600 12.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #dbe5ef; }
      .is   { font: 400 10.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #8b9bad; }
      .lbl  { font: 400 10.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #7d8da0; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .conn { stroke: #6b7d94; stroke-width: 1.6; fill: none; marker-end: url(#a1); }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="749" rx="14" fill="#0e1420" stroke="#1e2a3d"/>

  <text class="h"  x="40" y="52">Single-Tenant Logistics Platform</text>
  <text class="hs" x="40" y="76">Request lifecycle, document access, and the scheduled month-end path</text>
  <line x1="40" y1="96" x2="960" y2="96" stroke="#1e2a3d"/>

  <!-- Browser -->
  <rect x="48" y="124" width="340" height="64" rx="10" fill="#101a2b" stroke="#2f5d9e"/>
  <text class="bt" x="68" y="150">React 19 SPA</text>
  <text class="bs" x="68" y="170">Role-scoped routes · client-side PDF &amp; Excel generation</text>

  <path class="conn" d="M 218 188 L 218 230"/>
  <text class="lbl" x="230" y="213">HTTPS · <tspan class="mono">Authorization: Bearer &lt;jwt&gt;</tspan></text>

  <!-- Nginx -->
  <rect x="48" y="236" width="340" height="56" rx="10" fill="#0f1725" stroke="#3a4a63"/>
  <text class="bt" x="68" y="262">Nginx</text>
  <text class="bs" x="68" y="280">TLS termination · 50 MB body limit for document uploads</text>

  <path class="conn" d="M 218 292 L 218 334"/>
  <text class="lbl" x="230" y="317"><tspan class="mono">proxy_pass</tspan> → :5000</text>

  <!-- Express -->
  <rect x="48" y="340" width="340" height="250" rx="10" fill="#0d1220" stroke="#4a3a7a"/>
  <text class="bt" x="68" y="366">Express API</text>
  <text class="bs" x="68" y="384">Node.js · ESM · single artifact with the React build</text>

  <rect x="64" y="398" width="308" height="52" rx="7" fill="#141c2e" stroke="#24314a"/>
  <text class="it" x="78" y="418">Public routes</text>
  <text class="is" x="78" y="436">auth · landing stats · health · statement trigger</text>

  <rect x="64" y="458" width="308" height="52" rx="7" fill="#161f33" stroke="#3d5175"/>
  <text class="it" x="78" y="478"><tspan class="mono">verifyToken</tspan> — one global guard</text>
  <text class="is" x="78" y="496">everything mounted below is authenticated by default</text>

  <rect x="64" y="518" width="308" height="56" rx="7" fill="#141c2e" stroke="#24314a"/>
  <text class="it" x="78" y="538">Controllers → Models</text>
  <text class="is" x="78" y="556">raw SQL · CTEs · lateral joins · window functions</text>

  <path class="conn" d="M 218 590 L 218 632"/>
  <text class="lbl" x="230" y="615"><tspan class="mono">pg</tspan> pool (max 20) · parameterised SQL</text>

  <!-- PostgreSQL -->
  <rect x="48" y="638" width="340" height="76" rx="10" fill="#0e1a17" stroke="#2d6a45"/>
  <text class="bt" x="68" y="664">PostgreSQL</text>
  <text class="bs" x="68" y="684">31 tables · 33 foreign-key relationships</text>
  <text class="bs" x="68" y="700">money as <tspan class="mono">NUMERIC(12,2)</tspan> · type parsers overridden</text>

  <!-- Express → S3 -->
  <path class="conn" d="M 388 398 L 434 398"/>

  <!-- S3 -->
  <rect x="440" y="348" width="504" height="100" rx="10" fill="#191408" stroke="#6b5218"/>
  <text class="bt" x="462" y="376">AWS S3 — af-south-1</text>
  <text class="bs" x="462" y="398">Driver licences · roadworthy certificates · fuel slips</text>
  <text class="bs" x="462" y="416">Read — server mints a short-lived presigned URL; the browser fetches directly</text>
  <text class="bs" x="462" y="434">Write — <tspan class="mono">multer-s3</tspan> streams the upload without buffering to disk</text>

  <!-- Scheduler → Express -->
  <path class="conn" d="M 440 560 L 392 560"/>

  <!-- Scheduled month-end -->
  <rect x="440" y="488" width="504" height="210" rx="10" fill="#14100a" stroke="#5a4620"/>
  <text class="bt" x="462" y="516">Scheduled month-end</text>

  <rect x="458" y="530" width="468" height="44" rx="7" fill="#1b1710" stroke="#3d3222"/>
  <text class="it" x="472" y="548">EventBridge Scheduler — 1st of each month</text>
  <text class="is" x="472" y="565">retries and dead-lettering come free; the app need not be up</text>

  <rect x="458" y="584" width="468" height="44" rx="7" fill="#1b1710" stroke="#3d3222"/>
  <text class="it" x="472" y="602">Lambda — trigger only, no business logic</text>
  <text class="is" x="472" y="619"><tspan class="mono">POST /api/statements/generate</tspan> with a shared secret</text>

  <rect x="458" y="638" width="468" height="44" rx="7" fill="#1b1710" stroke="#3d3222"/>
  <text class="it" x="472" y="656">Generation runs inside the API, in one transaction</text>
  <text class="is" x="472" y="673">re-firing updates the period in place rather than duplicating it</text>

  <text class="lbl" x="440" y="726">The same endpoint backs the manual regeneration button, so scheduled and manual paths cannot drift apart.</text>
</svg>
